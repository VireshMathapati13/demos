name: Build and Push Docker Image to ACR

on:
  push:
    branches:
      - main
    paths:
      - '03-docker-python-demo-01/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Set up Docker BuildKit
      run: echo "DOCKER_CLI_AVAILABILITY=enabled" >> $GITHUB_ENV

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./03-docker-python-demo-01
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/my-python-app:latest
        cache-from: type=registry,ref=${{ secrets.ACR_LOGIN_SERVER }}/my-python-app:latest
        cache-to: type=inline
